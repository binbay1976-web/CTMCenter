<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Thiết Kế Dẫn Động Cơ Khí - V15 (Full Control)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 1150px; margin: auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #1e3a8a; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-bottom: 25px; text-transform: uppercase;}
        h3 { color: #2980b9; margin-top: 25px; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; font-size: 1.15em; display: flex; justify-content: space-between; align-items: center;}
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; align-items: end; }
        label { font-weight: 600; display: block; margin-top: 10px; font-size: 0.85em; color: #334155; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95em;}
        
        .btn-primary { width: 100%; background-color: #2563eb; color: white; padding: 15px; margin-top: 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; text-transform: uppercase;}
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-success { background-color: #10b981; color: white; padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-danger { background-color: #ef4444; color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8em; }
        
        .builder-area { background: #f8fafc; padding: 20px; border-radius: 8px; border: 2px dashed #94a3b8; margin-top: 15px;}
        .block-card { background: #fff; border: 1px solid #cbd5e1; padding: 15px; border-radius: 6px; margin-bottom: 15px; position: relative; border-left: 5px solid #3b82f6;}
        .block-header { font-weight: bold; color: #1e40af; margin-bottom: 10px; display: flex; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding-bottom: 5px;}
        
        .result-box { margin-top: 30px; padding: 20px; background-color: #f8f9fa; border-left: 6px solid #2ecc71; border-radius: 8px; display: none; }
        table { width: 100%; border-collapse: collapse; font-size: 0.95em; margin-top:15px; }
        th, td { padding: 12px; text-align: center; border: 1px solid #e2e8f0; }
        th { background-color: #e2e8f0; }
        .step-badge { background: #3498db; color: white; display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 0.9em; margin-bottom: 15px;}
        .highlight { color: #dc2626; font-weight: bold; }
    </style>
<link rel="stylesheet" href="shared-dark.css">
</head>
<body>

<div class="container">
    <h2>HỆ THỐNG THIẾT KẾ ĐỘNG HỌC TÙY BIẾN (V15)</h2>
    
    <h3>I. TẢI TRỌNG & BỘ PHẬN CÔNG TÁC</h3>
    <div class="grid-3">
        <div><label>Lực kéo P (N):</label><input type="number" id="P" value="1650"></div>
        <div><label>Vận tốc V (m/s):</label><input type="number" id="V" value="1.3"></div>
        <div>
            <label>Loại B/P Công Tác:</label>
            <select id="load_machine" onchange="toggleMachineType()">
                <option value="bang_tai">Băng tải (Tang)</option>
                <option value="xich_tai">Xích tải (Đĩa xích)</option>
            </select>
        </div>
        <div id="inp_D"><label>Đường kính tang D (mm):</label><input type="number" id="D" value="310"></div>
        <div id="inp_z" style="display:none;"><label>Số răng đĩa xích (z):</label><input type="number" id="z" value="11"></div>
        <div id="inp_p" style="display:none;"><label>Bước xích p (mm):</label><input type="number" id="p" value="25.4"></div>
        <div><label>Thời gian phục vụ (năm):</label><input type="number" id="years" value="5"></div>
        <div><label>Số ngày LV/năm:</label><input type="number" id="days" value="280"></div>
        <div><label>Số giờ LV/ngày:</label><input type="number" id="hours" value="21"></div>
    </div>

    <h3>III. HIỆU SUẤT CÁC BỘ TRUYỀN & Ổ LĂN (Bảng 2.3)</h3>
    <div class="grid-4" style="background:#e0f2fe; padding:15px; border-radius:8px;">
        <div><label>Khớp nối (η_kn):</label><input type="number" id="base_eta_kn" value="0.99" step="0.01"></div>
        <div><label>Ổ lăn (η_ol):</label><input type="number" id="base_eta_ol" value="0.99" step="0.01"></div>
        <div><label>Bánh răng (η_br):</label><input type="number" id="base_eta_br" value="0.97" step="0.01"></div>
        <div><label>Bộ truyền đai (η_đai):</label><input type="number" id="base_eta_dai" value="0.95" step="0.01"></div>
        <div><label>Bộ truyền xích (η_xích):</label><input type="number" id="base_eta_xich" value="0.97" step="0.01"></div>
    </div>

    <h3>II. SƠ ĐỒ HỆ THỐNG TRUYỀN ĐỘNG 
        <div style="display:flex; gap:10px;">
            <select id="newBlockType" style="margin:0; width:auto;">
                <option value="dai">Bộ truyền Đai</option>
                <option value="xich">Bộ truyền Xích</option>
                <option value="kn">Khớp Nối</option>
                <option value="hgt1">Hộp Giảm Tốc 1 Cấp</option>
                <option value="hgt2">Hộp Giảm Tốc 2 Cấp</option>
            </select>
            <button class="btn-success" style="margin:0;" onclick="addBlock()">+ THÊM CHI TIẾT</button>
        </div>
    </h3>
    
    <div id="blocksContainer" class="builder-area">
        </div>
    
    <button class="btn-primary" onclick="calculateStep1()">BƯỚC 1: TÍNH P_ct, n_sb VÀ CHỌN ĐỘNG CƠ ➔</button>

    <div id="motorSearchArea" style="display:none;">
        <div class="step-badge">BƯỚC 2: CHỌN ĐỘNG CƠ</div>
        <div id="step1_summary"></div>
        <div class="table-container" style="max-height: 250px; overflow-y:auto;">
            <table id="motorTable">
                <thead><tr><th>Kiểu</th><th>P (kW)</th><th>n (v/p)</th><th>n_db</th><th>Hành động</th></tr></thead>
                <tbody id="motorTableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="step2Area" style="display:none; margin-top:20px;">
        <div class="step-badge" style="background:#f59e0b;">BƯỚC 3: PHÂN PHỐI TỈ SỐ TRUYỀN & TÍNH ĐỘNG HỌC</div>
        <div id="ratioDistributorContainer"></div>
        <button class="btn-primary" style="background:#10b981;" onclick="calculateFinal()">HOÀN THÀNH & XUẤT BẢNG ĐỘNG HỌC ➔</button>
    </div>

    <div id="resultBox" class="result-box">
        <div class="step-badge" style="background:#2ecc71;">BẢNG KẾT QUẢ ĐỘNG HỌC CUỐI CÙNG</div>
        <div id="res_summary" class="grid-2"></div>
        <table id="kinematicTable">
            <thead id="k_thead"></thead>
            <tbody id="k_tbody"></tbody>
        </table>
    </div>
</div>

<script>
    // DATA & ENGINE LOGIC (BẢO TOÀN DỮ LIỆU)
    const motorDatabase = [
        { model: "DK.41-4", P: 1.7, n: 1420, ns: 1500, tk: 1.8 },
        { model: "DK.42-4", P: 2.8, n: 1420, ns: 1500, tk: 1.9 },
        { model: "4A100L4Y3", P: 4.0, n: 1420, ns: 1500, tk: 2.0 },
        { model: "4A132M4Y3", P: 11.0, n: 1458, ns: 1500, tk: 2.0 }
        // ... Các dòng khác trong database của bạn
    ];

    let blocks = [];
    let gl_Pt = 0, gl_Pct = 0, gl_nsb = 0, gl_nlv = 0, selectedMotor = null;

    function toggleMachineType() {
        let type = document.getElementById('load_machine').value;
        document.getElementById('inp_D').style.display = type === 'bang_tai' ? 'block' : 'none';
        document.getElementById('inp_z').style.display = type === 'xich_tai' ? 'block' : 'none';
        document.getElementById('inp_p').style.display = type === 'xich_tai' ? 'block' : 'none';
    }

    function addBlock() {
        let type = document.getElementById('newBlockType').value;
        let b = { id: Date.now(), type: type, u_sb: 1, eta: 1, k_ol: 1 };
        
        // Tự động gán giá trị mặc định từ Bảng III để tránh nhập tay
        if(type === 'dai') { b.u_sb = 3; b.eta = parseFloat(document.getElementById('base_eta_dai').value); b.k_ol = 1; }
        if(type === 'xich') { b.u_sb = 3; b.eta = parseFloat(document.getElementById('base_eta_xich').value); b.k_ol = 1; }
        if(type === 'kn') { b.u_sb = 1; b.eta = parseFloat(document.getElementById('base_eta_kn').value); b.k_ol = 1; }
        if(type === 'hgt1') { b.u_sb = 4; b.eta = parseFloat(document.getElementById('base_eta_br').value); b.k_ol = 2; }
        if(type === 'hgt2') { b.u_sb = 10; b.eta = parseFloat(document.getElementById('base_eta_br').value); b.k_ol = 3; }
        
        blocks.push(b);
        renderBlocks();
    }

    function renderBlocks() {
        let html = '';
        blocks.forEach((b, i) => {
            html += `<div class="block-card">
                <div class="block-header"><span>${i+1}. ${b.type.toUpperCase()}</span> <button class="btn-danger" onclick="blocks.splice(${i},1);renderBlocks();">Xóa</button></div>
                <div class="grid-4">
                    <div><label>u sơ bộ:</label><input type="number" step="any" value="${b.u_sb}" onchange="blocks[${i}].u_sb=parseFloat(this.value)||1"></div>
                    <div><label>Hiệu suất η:</label><input type="number" step="any" value="${b.eta}" onchange="blocks[${i}].eta=parseFloat(this.value)||1"></div>
                    <div><label>Số cặp ổ lăn:</label><input type="number" value="${b.k_ol}" onchange="blocks[${i}].k_ol=parseInt(this.value)||0"></div>
                </div>
            </div>`;
        });
        document.getElementById('blocksContainer').innerHTML = html;
    }

    function calculateStep1() {
        if(blocks.length === 0) return alert("Hãy thêm sơ đồ truyền động!");
        let P = parseFloat(document.getElementById('P').value);
        let V = parseFloat(document.getElementById('V').value);
        let eta_ol = parseFloat(document.getElementById('base_eta_ol').value);

        // nlv & Plv
        if(document.getElementById('load_machine').value === 'bang_tai') {
            gl_nlv = (60000 * V) / (Math.PI * parseFloat(document.getElementById('D').value));
        } else {
            gl_nlv = (60000 * V) / (parseFloat(document.getElementById('z').value) * parseFloat(document.getElementById('p').value));
        }
        gl_Pt = (P * V) / 1000; 

        // Tính Hiệu suất tổng & u tổng sơ bộ
        let etatot = 1; let utot = 1;
        blocks.forEach(b => {
            etatot *= b.eta * Math.pow(eta_ol, b.k_ol);
            utot *= b.u_sb;
        });

        gl_Pct = gl_Pt / etatot;
        gl_nsb = gl_nlv * utot;

        document.getElementById('step1_summary').innerHTML = `P_ct: <b>${gl_Pct.toFixed(3)} kW</b> | n_sb: <b>${gl_nsb.toFixed(1)} v/p</b>`;
        document.getElementById('motorSearchArea').style.display = 'block';
        
        // Render Motor Table
        let mHtml = '';
        motorDatabase.filter(m => m.P >= gl_Pct).forEach(m => {
            mHtml += `<tr><td>${m.model}</td><td>${m.P}</td><td>${m.n}</td><td>${m.ns}</td>
            <td><button class="btn-success" onclick="selectMotor(${JSON.stringify(m).replace(/"/g, '&quot;')})">Chọn</button></td></tr>`;
        });
        document.getElementById('motorTableBody').innerHTML = mHtml;
    }

    function selectMotor(m) {
        selectedMotor = m;
        document.getElementById('step2Area').style.display = 'block';
        let u_ht = m.n / gl_nlv;
        let html = `<p>u hệ thống cần phân bổ: <b>${u_ht.toFixed(3)}</b></p>`;
        blocks.forEach((b, i) => {
            if(b.type === 'kn') return;
            html += `<div class="block-card"><b>${b.type.toUpperCase()}</b>: <input type="number" id="u_act_${i}" value="${b.u_sb}" step="0.01"></div>`;
        });
        document.getElementById('ratioDistributorContainer').innerHTML = html;
    }

    function calculateFinal() {
        let shafts = [{ name: 'ĐC', n: selectedMotor.n, P: 0, T: 0 }];
        let eta_ol = parseFloat(document.getElementById('base_eta_ol').value);
        
        // Forward Pass: Tốc độ
        let cn = selectedMotor.n;
        blocks.forEach((b, i) => {
            let u = parseFloat(document.getElementById('u_act_'+i)?.value) || 1;
            cn = cn / u;
            shafts.push({ name: 'Trục '+(i+1), n: cn, P: 0, T: 0, b: b });
        });

        // Backward Pass: Công suất
        shafts[shafts.length-1].P = gl_Pt;
        for(let i = shafts.length-1; i > 0; i--) {
            let b = shafts[i].b;
            shafts[i-1].P = shafts[i].P / (b.eta * Math.pow(eta_ol, b.k_ol));
        }

        // Output Table
        let h = '<tr><th>Thông số</th>'; let p = '<tr><td>P (kW)</td>'; let n = '<tr><td>n (v/p)</td>';
        shafts.forEach(s => {
            h += `<th>${s.name}</th>`; p += `<td>${s.P.toFixed(3)}</td>`; n += `<td>${s.n.toFixed(1)}</td>`;
        });
        document.getElementById('k_thead').innerHTML = h+'</tr>';
        document.getElementById('k_tbody').innerHTML = p+'</tr>'+n+'</tr>';
        document.getElementById('resultBox').style.display = 'block';
    }
</script>
</body>
</html>
