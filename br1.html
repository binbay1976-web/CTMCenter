<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chương Trình 1: Bánh Răng Trụ Thẳng</title>
<style>
    * { box-sizing: border-box; }

    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        background: linear-gradient(180deg, #eef3f9 0%, #e9eef5 100%); 
        margin: 0; 
        padding: 20px; 
        color: #1b1f23; 
    }

    .container { 
        max-width: 1250px; 
        margin: auto; 
        background: #ffffff; 
        padding: 30px; 
        border-radius: 18px; 
        box-shadow: 0 10px 24px rgba(30, 50, 90, 0.1); 
    }

    h1 { 
        text-align: center; 
        color: #fff; 
        background: linear-gradient(135deg, #173b6d, #29589b);
        padding: 20px; 
        border-radius: 12px;
        text-transform: uppercase; 
        margin-top: 0;
        box-shadow: 0 6px 15px rgba(20, 48, 86, 0.2);
    }
    
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 15px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 15px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 15px; }
    
    label { font-weight: 600; font-size: 14px; color: #475569; display: block; margin-bottom: 5px; margin-top: 10px;}
    input, select { 
        width: 100%; 
        padding: 10px; 
        border: 1px solid #cfd9e6; 
        border-radius: 8px; 
        font-size: 14px; 
        background-color: #f8fbff; 
        transition: 0.2s;
    }
    input:focus, select:focus {
        border-color: #5a8dee;
        box-shadow: 0 0 0 3px rgba(90, 141, 238, 0.14);
        background: #fff;
        outline: none;
    }

    button { 
        width: 100%; 
        color: white; 
        padding: 15px; 
        border: none; 
        border-radius: 12px; 
        font-size: 16px; 
        font-weight: bold; 
        cursor: pointer; 
        transition: 0.2s; 
        margin-top: 20px; 
        text-transform: uppercase; 
        background: linear-gradient(135deg, #8b3dff, #c548e8);
        box-shadow: 0 10px 18px rgba(164, 73, 233, 0.25);
    }
    button:hover { 
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(164, 73, 233, 0.32);
    }
    
    .step-title { background-color: #29589b !important; color: white !important; font-weight: bold; text-align: center; font-size: 16px; padding: 12px; border-radius: 6px; margin-top: 20px;}
    .material-panel { background: #ffffff; border: 1px solid #dbe5f0; box-shadow: 0 4px 10px rgba(30, 50, 90, 0.05); padding: 15px; border-radius: 12px; margin-bottom: 15px;}
    
    /* VÙNG KẾT QUẢ ĐƯỢC ẨN LÚC ĐẦU */
    #result_area { margin-top: 30px; display: none; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; border-radius: 8px; overflow: hidden; box-shadow: 0 6px 15px rgba(0,0,0,0.08);}
    th, td { padding: 12px; border: 1px solid var(--dm-border); text-align: left; }
    th { font-weight: bold; text-align: center;}
    td { text-align: center; }
    
    tr:nth-child(even) td, tr:nth-child(odd) td, tr:nth-child(even), tr:nth-child(odd) { 
        background-color: transparent !important; 
    }
    
    /* ĐÃ SỬA: Chuyển thành chữ thường (nhạt) thay vì in đậm */
    .highlight { color: #ff4d4d !important; font-weight: normal; } /* Đỏ tươi */
    .success { color: #10b981 !important; font-weight: normal; } /* Xanh lá */
    
    .canvas-container { text-align: center; margin: 20px 0; border: 2px dashed #cbd5e1; border-radius: 12px; background: #fff; padding: 10px; overflow-x: auto; }
</style>
<link rel="stylesheet" href="shared-dark.css">
</head>
<body>
<div class="container">
    <h1>THIẾT KẾ BÁNH RĂNG TRỤ THẲNG</h1>
    
    <form id="main_form">
        <h3 class="step-title" style="margin-top: 0;text-align: left;">I. CÁC THÔNG SỐ ĐẦU VÀO</h3>
        <div class="grid-4">
            <div><label>Công suất P1 (kW):</label><input type="number" step="any" id="P1" value="15.7" required></div>
            <div><label>Vòng quay n1 (vg/ph):</label><input type="number" step="any" id="n1" value="187.5" required></div>
            <div><label>Tỉ số truyền u:</label><input type="number" step="any" id="ud" value="5" required></div>
            <div><label>T.gian phục vụ Lh (h):</label><input type="number" step="any" id="Lh" value="5000" required></div>
        </div>
        <div class="grid-3">
            <div><label>Chiều tải trọng (KFC):</label>
                <select id="kfc">
                    <option value="1.0">Quay 1 chiều (KFC = 1.0)</option>
                    <option value="0.75">Quay 2 chiều (KFC = 0.75)</option>
                </select>
            </div>
            <div><label>Hệ số quá tải Kqt:</label><input type="number" step="any" id="Kqt" value="2.0"></div>
            <div><label>Hệ số nhám ZR:</label><input type="number" step="any" id="ZR" value="0.95"></div>
        </div>

        <div style="background:#f8fafc; padding:15px; border:1px dashed #5a8dee; border-radius:12px; margin-bottom: 20px;">
            <h4 style="margin-top:0; color:#173b6d; border-bottom: 1px solid #cfd9e6; padding-bottom: 5px;">QUYỀN ĐIỀU KHIỂN HỆ SỐ & TRA BẢNG</h4>
            <div class="grid-4" style="margin-bottom:0;">
                <div><label>Chế độ KHβ, KFβ:</label>
                    <select id="k_mode" onchange="toggleKMode()">
                        <option value="auto">Tự động tra Bảng 6.7</option>
                        <option value="manual">Nhập tay</option>
                    </select>
                </div>
                <div class="manual-k" style="display:none;"><label>Nhập KHβ:</label><input type="number" step="any" id="KHb_user" value="1.0"></div>
                <div class="manual-k" style="display:none;"><label>Nhập KFβ:</label><input type="number" step="any" id="KFb_user" value="1.14"></div>
                <div><label>Hệ số Mô-đun (0.01-0.02):</label><input type="number" step="0.001" id="m_coef" value="0.015"></div>
            </div>
        </div>

        <h3 class="step-title" style="text-align: left;">II. VẬT LIỆU, ỨNG SUẤT VÀ SƠ ĐỒ BỐ TRÍ</h3>
        <div class="grid-2">
            <div class="material-panel">
                <h4 style="margin-top:0; color:#173b6d;">VẬT LIỆU BÁNH 1 (CHỦ ĐỘNG)</h4>
                <label>Mác thép:</label>
                <select id="b1_mat" onchange="updateGenMaterial('b1')"></select>
                <label id="b1_hard_label">Nhập độ cứng:</label>
                <input type="number" step="1" id="b1_hard_val" value="52" oninput="updateGenPsiBa()">
                <label>Lựa chọn phôi (σb & σch):</label><select id="b1_opt"></select>
                <label>Công thức σHlim:</label><select id="b1_sH_form"></select>
                <label>Công thức σFlim:</label><select id="b1_sF_form"></select>
            </div>
            <div class="material-panel">
                <h4 style="margin-top:0; color:#173b6d;">VẬT LIỆU BÁNH 2 (BỊ DẪN)</h4>
                <label>Mác thép:</label>
                <select id="b2_mat" onchange="updateGenMaterial('b2')"></select>
                <label id="b2_hard_label">Nhập độ cứng:</label>
                <input type="number" step="1" id="b2_hard_val" value="230" oninput="updateGenPsiBa()">
                <label>Lựa chọn phôi (σb & σch):</label><select id="b2_opt"></select>
                <label>Công thức σHlim:</label><select id="b2_sH_form"></select>
                <label>Công thức σFlim:</label><select id="b2_sF_form"></select>
            </div>
        </div>
        
        <div style="background:#fffbeb; padding:15px; border:1px dashed #f59e0b; border-radius:12px;">
            <div class="grid-2" style="margin-bottom:0;">
                <div>
                    <label>Sơ đồ bố trí ổ (Trục):</label>
                    <select id="bo_tri" onchange="updateGenPsiBa()">
                        <option value="khong_doixung">Bố trí Không đối xứng</option>
                        <option value="doixung">Bố trí Đối xứng</option>
                        <option value="chia">Bố trí Chia</option>
                    </select>
                </div>
                <div>
                    <label>Hệ số chiều rộng vành răng (ψba): <span id="psi_ba_hint" style="color:#d97706; font-size:12px;"></span></label>
                    <input type="number" step="0.001" id="psi_ba" value="0.3">
                </div>
            </div>
        </div>
        <button type="button" onclick="triggerUpdate()">THỰC HIỆN THIẾT KẾ</button>
    </form>

    <div id="result_area"></div>
</div>

<script>
    function triggerUpdate() {
        document.getElementById('result_area').style.display = 'block';
        calculateGear();
        setTimeout(() => {
            document.getElementById('result_area').scrollIntoView({ behavior: 'smooth' });
        }, 50);
    }

    // --- DATABASE TỪ PYTHON ---
    const GENERAL_MATERIAL_DB = {
        'C45_TH': {name: 'Thép 45 (Thường hóa)', type: 'mem', hard_type: 'HB', hard_min: 170, hard_max: 217, options: [{label: 'S ≤ 100mm', sch: 340, sb: 600}]},
        'C45_TC': {name: 'Thép 45 (Tôi cải thiện)', type: 'mem', hard_type: 'HB', hard_min: 192, hard_max: 285, options: [{label: 'S > 60mm', sch: 450, sb: 750}, {label: 'S ≤ 60mm', sch: 580, sb: 850}]},
        '40X_TC': {name: 'Thép 40X (Tôi cải thiện)', type: 'mem', hard_type: 'HB', hard_min: 230, hard_max: 280, options: [{label: 'S ≤ 100mm', sch: 550, sb: 850}, {label: 'S ≤ 60mm', sch: 700, sb: 950}]},
        '40XH_TBM': {name: 'Thép 40XH (Tôi bề mặt)', type: 'cung', hard_type: 'HRC', hard_min: 45, hard_max: 55, options: [{label: 'Lõi tôi cải thiện', sch: 1400, sb: 1600}]},
        '20X_ThC': {name: 'Thép 20X (Thấm C, Tôi)', type: 'cung', hard_type: 'HRC', hard_min: 56, hard_max: 63, options: [{label: 'S ≤ 60mm', sch: 400, sb: 650}]},
        '18CrMnTi_ThC': {name: 'Thép 18CrMnTi (Thấm C, Tôi)', type: 'cung', hard_type: 'HRC', hard_min: 58, hard_max: 63, options: [{label: 'Tiết diện vừa', sch: 850, sb: 1100}]}
    };

    const SHLIM_FORMULAS = [
        {id: 'fH1', name: '2.HB + 70 (Thường hóa, Tôi CT)', type: 'mem'},
        {id: 'fH2', name: '18.HRC + 150 (Tôi thể tích)', type: 'cung'},
        {id: 'fH3', name: '17.HRC + 200 (Tôi bề mặt)', type: 'cung'},
        {id: 'fH4', name: '23.HRC (Thấm Cacbon)', type: 'cung'}
    ];

    const SFLIM_FORMULAS = [
        {id: 'fF1', name: '1.8.HB (Thường hóa, Tôi CT)', type: 'mem'},
        {id: 'fF2', name: '550 MPa (Tôi thể tích)', type: 'cung'},
        {id: 'fF3', name: '900 MPa (Tôi bề mặt)', type: 'cung'},
        {id: 'fF4', name: '750 MPa (Thấm cacbon thép không Mo)', type: 'cung'}
    ];

    const TABLE_SOFT_KHB = [[0.2,1.08,1.05,1.02,1.01,1.01,1.00,1.00],[0.4,1.18,1.12,1.05,1.03,1.02,1.01,1.01],[0.6,1.31,1.19,1.07,1.05,1.03,1.02,1.02],[0.8,1.45,1.27,1.12,1.08,1.05,1.03,1.02],[1.0,null,1.32,1.23,1.16,1.10,1.05,1.03],[1.2,null,1.43,1.27,1.20,1.14,1.06,1.04],[1.4,null,null,1.31,1.22,1.16,1.08,1.05],[1.6,null,null,1.38,1.28,1.19,1.12,1.06]];
    const TABLE_SOFT_KFB = [[0.2,1.18,1.10,1.05,1.03,1.02,1.01,1.00],[0.4,1.38,1.21,1.11,1.06,1.05,1.03,1.01],[0.6,1.61,1.39,1.17,1.12,1.08,1.05,1.02],[0.8,1.95,1.58,1.24,1.17,1.12,1.07,1.03],[1.0,null,1.78,1.32,1.23,1.16,1.10,1.05],[1.2,null,1.98,1.41,1.30,1.22,1.14,1.07],[1.4,null,null,1.51,1.38,1.28,1.19,1.12],[1.6,null,null,1.61,1.45,1.37,1.26,1.15]];
    const TABLE_HARD_KHB = [[0.2,1.22,1.10,1.05,1.04,1.02,1.01,1.00],[0.4,1.44,1.25,1.12,1.08,1.05,1.02,1.01],[0.6,null,1.45,1.20,1.14,1.08,1.04,1.02],[0.8,null,1.65,1.28,1.20,1.14,1.07,1.03],[1.0,null,null,1.37,1.27,1.19,1.12,1.06],[1.2,null,null,1.47,1.35,1.25,1.16,1.08]];
    const TABLE_HARD_KFB = [[0.2,1.30,1.20,1.08,1.04,1.03,1.02,1.00],[0.4,1.69,1.42,1.18,1.06,1.10,1.04,1.01],[0.6,null,1.71,1.30,1.17,1.12,1.08,1.03],[0.8,null,1.95,1.43,1.27,1.20,1.14,1.06],[1.0,null,null,1.57,1.39,1.28,1.20,1.11],[1.2,null,null,1.72,1.53,1.41,1.30,1.15]];

    // --- KHỞI TẠO UI ---
    function initUI() {
        const b1Select = document.getElementById('b1_mat');
        const b2Select = document.getElementById('b2_mat');
        for (let key in GENERAL_MATERIAL_DB) {
            b1Select.add(new Option(GENERAL_MATERIAL_DB[key].name, key));
            b2Select.add(new Option(GENERAL_MATERIAL_DB[key].name, key));
        }
        b1Select.value = '40XH_TBM';
        b2Select.value = '40X_TC';
        
        updateGenMaterial('b1');
        updateGenMaterial('b2');
        
        document.getElementById('psi_ba').addEventListener('input', function() { this.setAttribute('data-touched', 'true'); });
    }

    function toggleKMode() {
        const mode = document.getElementById('k_mode').value;
        document.querySelectorAll('.manual-k').forEach(el => el.style.display = mode === 'manual' ? 'block' : 'none');
    }

    function updateGenMaterial(prefix) {
        const matKey = document.getElementById(prefix + '_mat').value;
        const matData = GENERAL_MATERIAL_DB[matKey];
        
        document.getElementById(prefix + '_hard_label').innerHTML = `Độ cứng ${matData.hard_type} (${matData.hard_min} - ${matData.hard_max}):`;
        const hardInput = document.getElementById(prefix + '_hard_val');
        hardInput.min = matData.hard_min; hardInput.max = matData.hard_max;
        
        const optSelect = document.getElementById(prefix + '_opt');
        optSelect.innerHTML = '';
        matData.options.forEach((opt, idx) => {
            optSelect.add(new Option(`${opt.label} (σb=${opt.sb}, σch=${opt.sch})`, idx));
        });

        const hForm = document.getElementById(prefix + '_sH_form');
        const fForm = document.getElementById(prefix + '_sF_form');
        hForm.innerHTML = ''; fForm.innerHTML = '';
        
        SHLIM_FORMULAS.forEach(f => { if (f.type === matData.type) hForm.add(new Option(f.name, f.id)); });
        SFLIM_FORMULAS.forEach(f => { if (f.type === matData.type) fForm.add(new Option(f.name, f.id)); });
        
        if(prefix==='b1' && matData.hard_type==='HRC' && hardInput.value < 40) hardInput.value = 52;
        if(prefix==='b2' && matData.hard_type==='HB' && hardInput.value < 100) hardInput.value = 230;

        updateGenPsiBa();
    }

    function updateGenPsiBa() {
        const hb1 = parseFloat(document.getElementById('b1_hard_val').value) || 0;
        const hb2 = parseFloat(document.getElementById('b2_hard_val').value) || 0;
        const mat1 = GENERAL_MATERIAL_DB[document.getElementById('b1_mat').value];
        const mat2 = GENERAL_MATERIAL_DB[document.getElementById('b2_mat').value];
        const eff_hb1 = mat1.hard_type === 'HRC' ? hb1 * 10 : hb1;
        const eff_hb2 = mat2.hard_type === 'HRC' ? hb2 * 10 : hb2;

        const isHard = (eff_hb1 > 350 && eff_hb2 > 350); 
        const botri = document.getElementById('bo_tri').value;
        let min=0.3, max=0.5, def=0.4;
        
        if (botri === 'doixung') { min = isHard ? 0.25 : 0.3; max = isHard ? 0.3 : 0.5; def = isHard ? 0.28 : 0.4; }
        else if (botri === 'khong_doixung') { min = isHard ? 0.2 : 0.25; max = isHard ? 0.25 : 0.4; def = isHard ? 0.22 : 0.3; }
        else if (botri === 'chia') { min = isHard ? 0.15 : 0.2; max = isHard ? 0.2 : 0.25; def = isHard ? 0.18 : 0.22; }

        const psiInput = document.getElementById('psi_ba');
        document.getElementById('psi_ba_hint').innerText = `Gợi ý bảng tra: ${min} - ${max}`;
        psiInput.min = min; psiInput.max = max;
        if (!psiInput.getAttribute('data-touched')) psiInput.value = def;
    }

    // --- HÀM TOÁN HỌC & BỔ TRỢ ---
    function get_standard_module(m_calc) {
        const stds = [1.0, 1.25, 1.5, 2.0, 2.5, 3.0, 4.0, 5.0, 6.0, 8.0, 10.0, 12.0, 16.0];
        for (let m of stds) if (m >= m_calc) return m;
        return stds[stds.length - 1];
    }

    function interpolate_factor(table, psi_bd, col_idx) {
        let pts = table.filter(row => row[col_idx] !== null).map(row => [row[0], row[col_idx]]);
        if (pts.length === 0) return 1.0;
        if (psi_bd <= pts[0][0]) return pts[0][1];
        if (psi_bd >= pts[pts.length - 1][0]) return pts[pts.length - 1][1];
        for (let i = 0; i < pts.length - 1; i++) {
            let x1 = pts[i][0], y1 = pts[i][1], x2 = pts[i+1][0], y2 = pts[i+1][1];
            if (psi_bd >= x1 && psi_bd <= x2) {
                return y1 + (y2 - y1) * (psi_bd - x1) / (x2 - x1);
            }
        }
        return 1.0;
    }

    function calculate_shlim(id, h) { return id==='fH1' ? 2*h+70 : id==='fH2' ? 18*h+150 : id==='fH3' ? 17*h+200 : 23*h; }
    function calculate_sflim(id, h) { return id==='fF1' ? 1.8*h : id==='fF2' ? 550 : id==='fF3' ? 900 : 750; }

    // --- VẼ CANVAS MÔ PHỎNG BÁNH RĂNG TRỤ THẲNG ---
    function drawGearCanvas(canvasId, aw, d1, d2) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        const W = canvas.width; const H = canvas.height;
        ctx.clearRect(0, 0, W, H);
        
        const padding = 40;
        const scale = (W - padding * 2) / (2 * aw);
        
        const cx1 = padding + (d1/2)*scale;
        const cy = H / 2;
        const cx2 = cx1 + aw * scale;

        // Bánh chủ động
        ctx.beginPath();
        ctx.arc(cx1, cy, (d1/2)*scale, 0, 2*Math.PI);
        ctx.fillStyle = 'rgba(59, 130, 246, 0.2)'; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#1e3a8a'; ctx.setLineDash([5, 5]); ctx.stroke();
        ctx.setLineDash([]);
        
        // Bánh bị động
        ctx.beginPath();
        ctx.arc(cx2, cy, (d2/2)*scale, 0, 2*Math.PI);
        ctx.fillStyle = 'rgba(239, 68, 68, 0.2)'; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#991b1b'; ctx.setLineDash([5, 5]); ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = 'black';
        ctx.beginPath(); ctx.arc(cx1, cy, 4, 0, 2*Math.PI); ctx.fill();
        ctx.beginPath(); ctx.arc(cx2, cy, 4, 0, 2*Math.PI); ctx.fill();

        ctx.beginPath(); ctx.moveTo(cx1, cy); ctx.lineTo(cx2, cy);
        ctx.strokeStyle = '#475569'; ctx.setLineDash([10, 5, 2, 5]); ctx.stroke(); ctx.setLineDash([]);

        ctx.fillStyle = '#1e293b'; ctx.font = 'normal 14px Arial'; ctx.textAlign = 'center';
        ctx.fillText(`aw = ${aw.toFixed(2)} mm`, (cx1+cx2)/2, cy - 10);
        ctx.fillStyle = '#64748b'; ctx.font = 'italic 12px Arial';
        ctx.fillText("(Mô phỏng Bánh Răng Trụ Thẳng)", (cx1+cx2)/2, cy + 20);
    }

    // --- LOGIC TÍNH TOÁN CHÍNH ---
    function calculateGear() {
        try {
            const P1 = parseFloat(document.getElementById('P1').value);
            const n1 = parseFloat(document.getElementById('n1').value);
            const u = parseFloat(document.getElementById('ud').value);
            const Lh = parseFloat(document.getElementById('Lh').value);
            const Kqt = parseFloat(document.getElementById('Kqt').value);
            const KFC = parseFloat(document.getElementById('kfc').value);
            const psiba = parseFloat(document.getElementById('psi_ba').value);
            const bo_tri = document.getElementById('bo_tri').value;
            const ZR = parseFloat(document.getElementById('ZR').value);
            const k_mode = document.getElementById('k_mode').value;
            const KHb_user = parseFloat(document.getElementById('KHb_user').value);
            const KFb_user = parseFloat(document.getElementById('KFb_user').value);
            const m_coef = parseFloat(document.getElementById('m_coef').value);

            const mat1 = GENERAL_MATERIAL_DB[document.getElementById('b1_mat').value];
            const mat1_props = mat1.options[parseInt(document.getElementById('b1_opt').value)];
            const b1_hard_val = parseFloat(document.getElementById('b1_hard_val').value);
            const HB1 = mat1.hard_type === 'HB' ? b1_hard_val : b1_hard_val * 10;
            const sHlim1_0 = calculate_shlim(document.getElementById('b1_sH_form').value, b1_hard_val);
            const sFlim1_0 = calculate_sflim(document.getElementById('b1_sF_form').value, b1_hard_val);

            const mat2 = GENERAL_MATERIAL_DB[document.getElementById('b2_mat').value];
            const mat2_props = mat2.options[parseInt(document.getElementById('b2_opt').value)];
            const b2_hard_val = parseFloat(document.getElementById('b2_hard_val').value);
            const HB2 = mat2.hard_type === 'HB' ? b2_hard_val : b2_hard_val * 10;
            const sHlim2_0 = calculate_shlim(document.getElementById('b2_sH_form').value, b2_hard_val);
            const sFlim2_0 = calculate_sflim(document.getElementById('b2_sF_form').value, b2_hard_val);

            // Kiểm tra vật liệu
            let mat_check = "ĐẠT", mat_color = "success";
            if (mat1.type === 'cung' && mat2.type === 'cung') { mat_check = "ĐẠT (Hai bánh tôi cứng)"; }
            else if (HB1 < HB2 + 10) { mat_check = "CẢNH BÁO (Nên HB1 > HB2 + 10-15)"; mat_color = "highlight"; }

            const sH_max_cp = Math.min(2.8 * mat1_props.sch, 2.8 * mat2_props.sch);
            const sF1_max_cp = 0.8 * mat1_props.sch;
            const sF2_max_cp = 0.8 * mat2_props.sch;

            const NHO1 = 30 * Math.pow(HB1, 2.4), NHO2 = 30 * Math.pow(HB2, 2.4);
            const n2 = n1 / u;
            const NHE2 = 60 * 1 * n2 * Lh, NHE1 = u * NHE2;
            const KHL1 = NHE1 >= NHO1 ? 1.0 : Math.pow(NHO1/NHE1, 1/6);
            const KHL2 = NHE2 >= NHO2 ? 1.0 : Math.pow(NHO2/NHE2, 1/6);
            const SH1 = mat1.type === 'mem' ? 1.1 : 1.2;
            const SH2 = mat2.type === 'mem' ? 1.1 : 1.2;
            
            const sH_cp1_base = (sHlim1_0 / SH1) * KHL1;
            const sH_cp2_base = (sHlim2_0 / SH2) * KHL2;
            const sF_cp1 = (sFlim1_0 / 1.75) * KFC;
            const sF_cp2 = (sFlim2_0 / 1.75) * KFC;

            const T1 = 9.55 * Math.pow(10, 6) * P1 / n1;
            
            // Bánh Răng Trụ Thẳng -> Lấy min
            const sH_cp_base = Math.min(sH_cp1_base, sH_cp2_base);
            const sH_cp_sobo = sH_cp_base;
            const sH_cp_cx = sH_cp_base * ZR;

            const psi_bd_calc = 0.5 * psiba * (u + 1);
            const is_hard = (HB1 > 350 && HB2 > 350);
            const T_KHb = is_hard ? TABLE_HARD_KHB : TABLE_SOFT_KHB;
            const T_KFb = is_hard ? TABLE_HARD_KFB : TABLE_SOFT_KFB;
            
            let col_idx = bo_tri === 'chia' ? 2 : (bo_tri === 'khong_doixung' ? 3 : 5);
            
            const KHb_use = k_mode === 'manual' ? KHb_user : interpolate_factor(T_KHb, psi_bd_calc, col_idx);
            const KFb_use = k_mode === 'manual' ? KFb_user : interpolate_factor(T_KFb, psi_bd_calc, col_idx);

            const Ka = 49.5; 
            let aw_calc = Ka * (u + 1) * Math.pow((T1 * KHb_use) / (Math.pow(sH_cp_sobo, 2) * u * psiba), 1/3);
            let aw = Math.round(aw_calc);
            let m = get_standard_module(m_coef * aw);
            let x1 = 0, x2 = 0, delta_y = 0, alpha_w_deg = 20.0, aw_thuc;

            let z1_calc = (2 * aw) / (m * (u + 1));
            let z1 = Math.max(17, Math.floor(z1_calc));
            let z2 = Math.round(z1 * u);
            let um = z2 / z1;
            
            let a = m * (z1 + z2) / 2;
            if (aw > a) {
                aw_thuc = aw;
                let alpha = 20 * Math.PI / 180;
                let cos_alpha_w = (a / aw_thuc) * Math.cos(alpha);
                let alpha_w = Math.acos(cos_alpha_w);
                alpha_w_deg = alpha_w * 180 / Math.PI;
                let inv_alpha = Math.tan(alpha) - alpha;
                let inv_alpha_w = Math.tan(alpha_w) - alpha_w;
                let xt = ((z1 + z2) / 2) * (inv_alpha_w - inv_alpha) / Math.tan(alpha);
                let y = (aw_thuc - a) / m;
                delta_y = xt - y;
                x1 = xt / 2;
                x2 = xt - x1;
            } else {
                aw_thuc = a;
            }
            
            let dw1 = 2 * aw_thuc / (um + 1);
            let delta_u = Math.abs(um - u) / u * 100;
            let check_u = delta_u <= 4 ? "ĐẠT" : "KHÔNG ĐẠT (> 4%)";
            aw = aw_thuc;
            let bw2 = Math.round(psiba * aw);
            let bw1 = bw2 + 4;
            
            const ZM = 274;
            let eps_alpha = (1.88 - 3.2*(1/z1 + 1/z2));
            let Zeps = Math.sqrt((4 - eps_alpha) / 3);
            let ZH = 1.76;
            
            let KH = KHb_use * 1.13 * 1.03;
            let sH_thuc = ZM * ZH * Zeps * Math.sqrt((2 * T1 * KH * (um + 1)) / (bw2 * Math.pow(dw1, 2) * um));
            let check_sH = sH_thuc <= sH_cp_cx ? "ĐẠT" : "KHÔNG ĐẠT";
            let color_sH = sH_thuc <= sH_cp_cx ? "success" : "highlight";

            let d1 = m * z1;
            let d2 = m * z2;
            let da1 = d1 + 2*m*(1 + x1 - delta_y);
            let da2 = d2 + 2*m*(1 + x2 - delta_y);
            let df1 = d1 - 2*m*(1.25 - x1);
            let df2 = d2 - 2*m*(1.25 - x2);
            let Ft = 2 * T1 / dw1;
            let Fr = Ft * Math.tan(20 * Math.PI / 180);
            let Fa = 0;

            let aw_suggestion_html = "", need_recalc = false;
            let error_pct = 0;
            let aw_new = aw, m_new = m, z1_new = z1, z2_new = z2, um_new = um, x1_new = x1, x2_new = x2, delta_y_new = delta_y, alpha_w_deg_new = alpha_w_deg;
            let bw1_new = bw1, bw2_new = bw2, dw1_new = dw1, sH_thuc_new = sH_thuc;

            if (sH_thuc > sH_cp_cx) {
                error_pct = ((sH_thuc - sH_cp_cx) / sH_cp_cx) * 100;
                if (error_pct <= 20) {
                    need_recalc = true;
                    let aw_new_calc = aw * Math.pow(Math.pow(sH_thuc / sH_cp_cx, 2), 1/3);
                    aw_new = Math.round(aw_new_calc);
                    if (aw_new <= aw) aw_new = aw + 1;
                    if (aw_new % 2 !== 0) aw_new += 1;
                    
                    for (let step = 0; step < 15; step++) {
                        m_new = get_standard_module(m_coef * aw_new);
                        let z1_calc_new = (2 * aw_new) / (m_new * (u + 1));
                        z1_new = Math.max(17, Math.floor(z1_calc_new));
                        z2_new = Math.round(z1_new * u);
                        um_new = z2_new / z1_new;
                        
                        let a_new = m_new * (z1_new + z2_new) / 2;
                        x1_new = 0; x2_new = 0; delta_y_new = 0; alpha_w_deg_new = 20.0;
                        let aw_thuc_new = a_new;
                        
                        if (aw_new > a_new) {
                            aw_thuc_new = aw_new;
                            let alpha = 20 * Math.PI/180;
                            let cos_alpha_w = (a_new / aw_thuc_new) * Math.cos(alpha);
                            let alpha_w = Math.acos(cos_alpha_w);
                            alpha_w_deg_new = alpha_w * 180 / Math.PI;
                            let inv_alpha = Math.tan(alpha) - alpha;
                            let inv_alpha_w = Math.tan(alpha_w) - alpha_w;
                            let xt = ((z1_new + z2_new) / 2) * (inv_alpha_w - inv_alpha) / Math.tan(alpha);
                            let y = (aw_thuc_new - a_new) / m_new;
                            delta_y_new = xt - y;
                            x1_new = xt / 2; x2_new = xt - x1_new;
                        }
                        
                        dw1_new = 2 * aw_thuc_new / (um_new + 1);
                        bw2_new = Math.round(psiba * aw_thuc_new);
                        bw1_new = bw2_new + 4;
                        
                        let eps_alpha_new = (1.88 - 3.2*(1/z1_new + 1/z2_new));
                        let Zeps_new = Math.sqrt((4 - eps_alpha_new) / 3);
                        sH_thuc_new = ZM * ZH * Zeps_new * Math.sqrt((2 * T1 * KH * (um_new + 1)) / (bw2_new * Math.pow(dw1_new, 2) * um_new));
                        
                        if (sH_thuc_new <= sH_cp_cx) {
                            aw_new = aw_thuc_new; break;
                        } else {
                            aw_new = aw_thuc_new + 2;
                        }
                    }
                    aw_suggestion_html = `<tr><td colspan="3" style="background-color:#2a2a2a; color:#fbbf24; padding:15px;">
                        <span>⚠️ BÁO CÁO TỪ VÒNG LẶP MÔ PHỎNG:</span><br>
                        Do ứng suất sinh ra (${sH_thuc.toFixed(1)} MPa) lớn hơn giới hạn chính xác ([σH] = ${sH_cp_cx.toFixed(1)} MPa) (Vượt ${error_pct.toFixed(1)}%).<br>
                        <span style="color:#10b981;">Hệ thống đã tự động chạy vòng lặp tìm nghiệm chẵn và chốt a<sub>w</sub> = ${aw_new.toFixed(1)} mm ở BẢNG 2!</span>
                    </td></tr>`;
                } else {
                    aw_suggestion_html = `<tr><td colspan="3" style="background-color:#3f1010; color:#ff4d4d; padding:15px;">
                        <span>🚨 GIỚI HẠN ĐỎ (Vượt ${error_pct.toFixed(1)}% > 20%):</span><br>Ứng suất tiếp xúc đang vượt quá xa mức chịu đựng của vật liệu. Hãy đổi Mác thép khác.
                    </td></tr>`;
                }
            }

            let html_uon_quatai_b1 = "";
            if (!need_recalc) {
                let YF1 = 3.47 + 13.2 / z1; let YF2 = 3.47 + 13.2 / z2;
                let KF_thuc = KFb_use * 1.37 * 1.07;
                let sF1_thuc = (2 * T1 * KF_thuc * 1.0 * 1.0 * YF1) / (bw1 * dw1 * m);
                let sF2_thuc = sF1_thuc * YF2 / YF1;
                let sH_max = sH_thuc * Math.sqrt(Kqt);
                let sF1_max = sF1_thuc * Kqt; let sF2_max = sF2_thuc * Kqt;

                html_uon_quatai_b1 = `
                <tr><td colspan="3" class="step-title">4. KIỂM NGHIỆM ĐỘ BỀN UỐN MỎI</td></tr>
                <tr><th>Ứng suất uốn Bánh 1 (σF1)</th><td><span>${sF1_thuc.toFixed(1)} MPa</span></td><td class="${sF1_thuc<=sF_cp1?'success':'highlight'}">${sF1_thuc<=sF_cp1?'ĐẠT':'KHÔNG ĐẠT'} (≤ ${sF_cp1.toFixed(1)})</td></tr>
                <tr><th>Ứng suất uốn Bánh 2 (σF2)</th><td><span>${sF2_thuc.toFixed(1)} MPa</span></td><td class="${sF2_thuc<=sF_cp2?'success':'highlight'}">${sF2_thuc<=sF_cp2?'ĐẠT':'KHÔNG ĐẠT'} (≤ ${sF_cp2.toFixed(1)})</td></tr>
                <tr><td colspan="3" class="step-title">5. KIỂM NGHIỆM QUÁ TẢI (TĨNH)</td></tr>
                <tr><th>Quá tải Tiếp xúc (σHmax)</th><td><span>${sH_max.toFixed(1)} MPa</span></td><td class="${sH_max<=sH_max_cp?'success':'highlight'}">${sH_max<=sH_max_cp?'ĐẠT':'KHÔNG ĐẠT'} (≤ ${sH_max_cp.toFixed(1)})</td></tr>
                <tr><th>Quá tải Uốn B1 (σF1max)</th><td><span>${sF1_max.toFixed(1)} MPa</span></td><td class="${sF1_max<=sF1_max_cp?'success':'highlight'}">${sF1_max<=sF1_max_cp?'ĐẠT':'KHÔNG ĐẠT'} (≤ ${sF1_max_cp.toFixed(1)})</td></tr>
                <tr><th>Quá tải Uốn B2 (σF2max)</th><td><span>${sF2_max.toFixed(1)} MPa</span></td><td class="${sF2_max<=sF2_max_cp?'success':'highlight'}">${sF2_max<=sF2_max_cp?'ĐẠT':'KHÔNG ĐẠT'} (≤ ${sF2_max_cp.toFixed(1)})</td></tr>
                <tr><td colspan="3" class="step-title">6. TỔNG KẾT KÍCH THƯỚC CHẾ TẠO VÀ LỰC</td></tr>
                <tr><th>Chiều rộng vành răng (bw1 / bw2)</th><td><span style="color:#60a5fa;">${bw1} / ${bw2} mm</span></td><td>Bánh nhỏ làm rộng hơn 4mm</td></tr>
                <tr><th>Đường kính chia (d1 / d2)</th><td>${d1.toFixed(2)} / ${d2.toFixed(2)} mm</td><td>d = m.z / cosβ</td></tr>
                <tr><th>Đường kính vòng đỉnh (da1 / da2)</th><td>${da1.toFixed(2)} / ${da2.toFixed(2)} mm</td><td>da = d + 2m(1 + x - Δy)</td></tr>
                <tr><th>Đường kính vòng chân (df1 / df2)</th><td>${df1.toFixed(2)} / ${df2.toFixed(2)} mm</td><td>df = d - 2m(1.25 - x)</td></tr>
                <tr><th>Lực ăn khớp (Ft / Fr / Fa)</th><td><span style="color:#f59e0b;">${Ft.toLocaleString('en-US',{maximumFractionDigits:0})} N / ${Fr.toLocaleString('en-US',{maximumFractionDigits:0})} N / ${Fa.toLocaleString('en-US',{maximumFractionDigits:0})} N</span></td><td>Dùng để tính ổ bi trục</td></tr>
                `;
            }

            let html_dich_chinh = (x1 !== 0 || x2 !== 0) ? `<tr><th>Hệ số dịch chỉnh (x1 / x2)</th><td><span style='color:#f59e0b;'>${x1.toFixed(3)} / ${x2.toFixed(3)}</span></td><td>Góc ăn khớp αw = ${alpha_w_deg.toFixed(2)}°</td></tr>` : "";

            let resultHtml = `
            <h2 style="text-align:center; color:#60a5fa; margin-top: 10px;">BẢNG 1: TÍNH NHÁP SƠ BỘ (a<sub>w</sub> = ${aw.toFixed(1)} mm)</h2>
            <div class="canvas-container"><canvas id="canvas_b1" width="600" height="200"></canvas></div>
            <table>
                <tr><td colspan="3" class="step-title">1. VẬT LIỆU BÁNH RĂNG</td></tr>
                <tr><th>Mác thép & Độ cứng</th><td>B1: ${mat1.name} (${mat1.hard_type} ${b1_hard_val.toFixed(1)})<br>B2: ${mat2.name} (${mat2.hard_type} ${b2_hard_val.toFixed(1)})</td><td><span class="${mat_color}">${mat_check}</span></td></tr>
                <tr><th>Tiếp xúc Cơ sở ([σH1] / [σH2])</th><td>${sH_cp1_base.toFixed(1)} / ${sH_cp2_base.toFixed(1)} MPa</td><td>Chưa tính độ nhám ZR</td></tr>
                <tr><th>Tiếp xúc CHUNG ([σH])</th><td>Sơ bộ: <span>${sH_cp_sobo.toFixed(1)}</span> | K.nghiệm: <span class="highlight">${sH_cp_cx.toFixed(1)}</span> MPa</td><td>Áp dụng ZR = ${ZR}</td></tr>
                <tr><th>Uốn cho phép ([σF1] / [σF2])</th><td>${sF_cp1.toFixed(1)} / ${sF_cp2.toFixed(1)} MPa</td><td>Từ Bảng 6.2</td></tr>
                <tr><td colspan="3" class="step-title">2. KÍCH THƯỚC CƠ BẢN & ĐỘNG HỌC</td></tr>
                <tr><th>Khoảng cách trục (aw)</th><td><span style="font-size:1.1em;">${aw.toFixed(1)} mm</span></td><td>Làm tròn chuẩn từ ${aw_calc.toFixed(2)} mm</td></tr>
                <tr><th>Mô đun tiêu chuẩn (m)</th><td><span>${m.toFixed(1)} mm</span></td><td>Tính theo hệ số m_coef = ${m_coef}</td></tr>
                <tr><th>Số răng (z1 / z2)</th><td><span>${z1} / ${z2} răng</span></td><td>-</td></tr>
                ${html_dich_chinh}
                <tr><th>Sai số Tỉ số truyền (Δu)</th><td>${delta_u.toFixed(2)} %</td><td class="${delta_u<=4?'success':'highlight'}">${check_u}</td></tr>
                <tr><th>Góc nghiêng thực tế (β)</th><td><span style="color:#f59e0b;">0.00 độ</span></td><td>Tính chính xác từ β sơ bộ</td></tr>
                <tr><td colspan="3" class="step-title">3. KIỂM NGHIỆM BỀN MỎI TIẾP XÚC</td></tr>
                <tr><th>Ứng suất tiếp xúc thực tế (σH)</th><td><span>${sH_thuc.toFixed(1)} MPa</span></td><td class="${color_sH}">${check_sH} (So với ${sH_cp_cx.toFixed(1)})</td></tr>
                ${aw_suggestion_html}
                ${html_uon_quatai_b1}
            </table>`;

            // BẢNG 2 NẾU CÓ VÒNG LẶP
            if (need_recalc) {
                let YF1_new = 3.47 + 13.2 / z1_new; let YF2_new = 3.47 + 13.2 / z2_new;
                let KF_loop = KFb_use * 1.37 * 1.07;
                let sF1_thuc_new = (2 * T1 * KF_loop * 1.0 * 1.0 * YF1_new) / (bw1_new * dw1_new * m_new);
                let sF2_thuc_new = sF1_thuc_new * YF2_new / YF1_new;
                
                let sH_max_new = sH_thuc_new * Math.sqrt(Kqt);
                let sF1_max_new = sF1_thuc_new * Kqt; let sF2_max_new = sF2_thuc_new * Kqt;
                
                let d1_new = m_new * z1_new; let d2_new = m_new * z2_new;
                let da1_new = d1_new + 2*m_new*(1 + x1_new - delta_y_new);
                let da2_new = d2_new + 2*m_new*(1 + x2_new - delta_y_new);
                let df1_new = d1_new - 2*m_new*(1.25 - x1_new);
                let df2_new = d2_new - 2*m_new*(1.25 - x2_new);

                let Ft_new = 2 * T1 / dw1_new; 
                let Fr_new = Ft_new * Math.tan(20 * Math.PI / 180);
                let Fa_new = 0;

                let html_dich_chinh_2 = (x1_new !== 0 || x2_new !== 0) ? `<tr><th>Hệ số dịch chỉnh (x1 / x2)</th><td><span style='color:#10b981;'>${x1_new.toFixed(3)} / ${x2_new.toFixed(3)}</span></td><td>Góc ăn khớp αw = ${alpha_w_deg_new.toFixed(2)}°</td></tr>` : "";

                resultHtml += `
                <br><hr style="border-top: 2px dashed #10b981; margin: 40px 0;">
                <h2 style="text-align:center; color:#10b981;">BẢNG 2: KẾT QUẢ KIỂM NGHIỆM CHÍNH THỨC (a<sub>w</sub> = ${aw_new.toFixed(1)} mm)</h2>
                <div class="canvas-container"><canvas id="canvas_b2" width="600" height="200"></canvas></div>
                <table>
                    <tr><td colspan="3" class="step-title" style="background-color:#047857 !important;">KÍCH THƯỚC CƠ BẢN ĐƯỢC CẬP NHẬT</td></tr>
                    <tr><th>Khoảng cách trục (aw)</th><td><span style="font-size:1.1em;">${aw_new.toFixed(1)} mm</span></td><td>Từ vòng lặp tự động sửa lỗi</td></tr>
                    <tr><th>Mô đun tiêu chuẩn (m)</th><td><span>${m_new.toFixed(1)} mm</span></td><td>Tính theo hệ số m_coef = ${m_coef}</td></tr>
                    <tr><th>Số răng (z1 / z2)</th><td><span>${z1_new} / ${z2_new} răng</span></td><td>Đã phân bổ lại</td></tr>
                    ${html_dich_chinh_2}
                    <tr><th>Góc nghiêng thực tế (β)</th><td><span>0.00 độ</span></td><td>Góc nghiêng sau điều chỉnh</td></tr>
                    
                    <tr><td colspan="3" class="step-title" style="background-color:#047857 !important;">BƯỚC 5 & 6: KIỂM NGHIỆM BỀN MỎI LẦN 2</td></tr>
                    <tr><th>Ứng suất tiếp xúc (σH)</th><td><span>${sH_thuc_new.toFixed(1)} MPa</span></td><td class="success">ĐẠT (≤ ${sH_cp_cx.toFixed(1)})</td></tr>
                    <tr><th>Ứng suất uốn Bánh 1 (σF1)</th><td><span>${sF1_thuc_new.toFixed(1)} MPa</span></td><td class="${sF1_thuc_new<=sF_cp1?'success':'highlight'}">${sF1_thuc_new<=sF_cp1?'ĐẠT':'KHÔNG ĐẠT'} (≤ ${sF_cp1.toFixed(1)})</td></tr>
                    <tr><th>Ứng suất uốn Bánh 2 (σF2)</th><td><span>${sF2_thuc_new.toFixed(1)} MPa</span></td><td class="${sF2_thuc_new<=sF_cp2?'success':'highlight'}">${sF2_thuc_new<=sF_cp2?'ĐẠT':'KHÔNG ĐẠT'} (≤ ${sF_cp2.toFixed(1)})</td></tr>

                    <tr><td colspan="3" class="step-title" style="background-color:#047857 !important;">BƯỚC 7: KIỂM NGHIỆM QUÁ TẢI LẦN 2</td></tr>
                    <tr><th>Quá tải Tiếp xúc (σHmax)</th><td><span>${sH_max_new.toFixed(1)} MPa</span></td><td class="${sH_max_new<=sH_max_cp?'success':'highlight'}">${sH_max_new<=sH_max_cp?'ĐẠT':'KHÔNG ĐẠT'} (≤ ${sH_max_cp.toFixed(1)})</td></tr>
                    <tr><th>Quá tải Uốn B1 (σF1max)</th><td><span>${sF1_max_new.toFixed(1)} MPa</span></td><td class="${sF1_max_new<=sF1_max_cp?'success':'highlight'}">${sF1_max_new<=sF1_max_cp?'ĐẠT':'KHÔNG ĐẠT'} (≤ ${sF1_max_cp.toFixed(1)})</td></tr>
                    <tr><th>Quá tải Uốn B2 (σF2max)</th><td><span>${sF2_max_new.toFixed(1)} MPa</span></td><td class="${sF2_max_new<=sF2_max_cp?'success':'highlight'}">${sF2_max_new<=sF2_max_cp?'ĐẠT':'KHÔNG ĐẠT'} (≤ ${sF2_max_cp.toFixed(1)})</td></tr>

                    <tr><td colspan="3" class="step-title" style="background-color:#047857 !important;">TỔNG KẾT CHẾ TẠO VÀ LỰC MỚI</td></tr>
                    <tr><th>Chiều rộng vành răng (bw1 / bw2)</th><td><span style="color:#60a5fa;">${bw1_new} / ${bw2_new} mm</span></td><td>Đã tính lại</td></tr>
                    <tr><th>Đường kính chia (d1 / d2)</th><td>${d1_new.toFixed(2)} / ${d2_new.toFixed(2)} mm</td><td>d = m.z / cosβ</td></tr>
                    <tr><th>Đường kính vòng đỉnh (da1 / da2)</th><td>${da1_new.toFixed(2)} / ${da2_new.toFixed(2)} mm</td><td>da = d + 2m(1 + x - Δy)</td></tr>
                    <tr><th>Đường kính vòng chân (df1 / df2)</th><td>${df1_new.toFixed(2)} / ${df2_new.toFixed(2)} mm</td><td>df = d - 2m(1.25 - x)</td></tr>
                    <tr><th>Lực ăn khớp (Ft / Fr / Fa)</th><td><span style="color:#f59e0b;">${Ft_new.toLocaleString('en-US',{maximumFractionDigits:0})} N / ${Fr_new.toLocaleString('en-US',{maximumFractionDigits:0})} N / ${Fa_new.toLocaleString('en-US',{maximumFractionDigits:0})} N</span></td><td>Đã tính toán lại chuẩn xác</td></tr>
                </table>`;
            }

            const resDiv = document.getElementById('result_area');
            resDiv.innerHTML = resultHtml;
            // resDiv.style.display = 'block'; // Đã xử lý ở hàm triggerUpdate()

            setTimeout(() => {
                drawGearCanvas('canvas_b1', aw, d1, d2);
                if (need_recalc) drawGearCanvas('canvas_b2', aw_new, d1_new, d2_new);
            }, 100);

        } catch (e) {
            document.getElementById('result_area').innerHTML = `<div style='background:#fee2e2; border-left:4px solid #ef4444; padding:15px; color:#b91c1c; font-weight:bold;'>Lỗi tính toán: ${e.message}</div>`;
            // document.getElementById('result_area').style.display = 'block'; // Đã xử lý ở hàm triggerUpdate()
        }
    }

    window.onload = initUI;
</script>
<script>
    // Nhận tín hiệu đổi màu từ trang chủ index.html gửi vào
    window.addEventListener('message', function(event) {
        if (event.data && event.data.theme === 'light') {
            document.body.classList.add('light-theme');
        } else if (event.data && event.data.theme === 'dark') {
            document.body.classList.remove('light-theme');
        }
    });

    // Khi load lại trang con, giữ nguyên chế độ màu đang cài đặt ở trang chủ
    if (localStorage.getItem('ctmc_theme') === 'light') {
        document.body.classList.add('light-theme');
    }
</script>
</body>
</html>
