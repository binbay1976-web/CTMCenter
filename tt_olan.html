        .tab { display: flex; background-color: #cbd5e1; }
        .tab button { flex: 1; border: none; outline: none; cursor: pointer; padding: 15px; font-size: 16px; font-weight: bold; transition: 0.3s; color: #475569; background: transparent;}
        .tab button:hover { background-color: #94a3b8; color: #fff;}
        .tab button.active { background-color: #fff; color: #1d4ed8; border-top: 4px solid #1d4ed8; border-bottom: none; }
        .tab button:disabled { color: #94a3b8; cursor: not-allowed; }
        
        .tabcontent { display: none; padding: 30px; min-height: 500px; }
        
        .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 5px; color: #334155; font-size: 0.9em; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1em;}
        input:focus, select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        
        .btn-primary { background-color: #2563eb; color: white; border: none; padding: 15px; font-size: 1.1em; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 20px; width: 100%; transition: background 0.3s;}
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-warning { background-color: #dc2626; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px;}
        .btn-warning:hover { background-color: #b91c1c; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: center; border: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #334155; position: sticky; top: 0; box-shadow: 0 1px 0 #cbd5e1;}
        .highlight { color: #dc2626; font-weight: bold; }
        .success { color: #16a34a; font-weight: bold; }
        
        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; flex-wrap: wrap; }
        .filter-bar .form-group { flex: 1; min-width: 140px; }
        .table-container { max-height: 500px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px;}
        .btn-select { background:#10b981; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer; font-weight:bold; }
        .btn-select:hover { background:#059669; }

        .status-pass { background-color: #dcfce7; color: #166534; padding: 15px; border-radius: 6px; font-weight: bold; border: 1px solid #bbf7d0;}
        .status-fail { background-color: #fee2e2; color: #991b1b; padding: 15px; border-radius: 6px; font-weight: bold; border: 1px solid #fecaca;}

                </div>
                <div class="form-group" style="background:#e0e7ff; padding:10px; border-radius:6px;">
                    <label>Hệ số tĩnh Y0 (VD: 0.5)</label><input type="number" step="any" id="Y0" value="0.5">
                </div>

                <div class="form-group">
                    <label>Loại ổ dự kiến</label>
                    <select id="loai_o">
                        <option value="bi_do">Ổ bi đỡ (m=3)</option>
                        <option value="bi_do_chan">Ổ bi đỡ chặn (m=3)</option>
                        <option value="dua_con">Ổ đũa côn (m=10/3)</option>
                    </select>
                </div>
                <div class="form-group"><label>Tham số e (Tra sơ bộ theo α)</label><input type="number" step="any" id="e_param" value="0.2"></div>
                <div class="form-group"><label>Hệ số Y</label><input type="number" step="any" id="Y_param" value="0.0"></div>
            </div>
            <button class="btn-primary" onclick="goToStep2()">LƯU THÔNG SỐ & MỞ KHO Ổ LĂN ➔</button>
        </div>

        <div id="TabTraCuu" class="tabcontent">
            <div style="margin-bottom: 15px; color: #0369a1; font-weight: bold;">💡 Gợi ý: Hãy nhập đường kính ngõng trục d để tìm kiếm nhanh. Nếu C báo đỏ, hãy tăng bộ lọc C lên.</div>

                </div>
                <div class="form-group">

                </div>

                </div>
                <div class="form-group">

                    <input type="number" id="filterC" placeholder="C >= ..." oninput="filterDB()">
                </div>
            </div>

        let inputData = {};

        function openTab(evt, tabName) {
            let tabcontent = document.getElementsByClassName("tabcontent");
            for (let i = 0; i < tabcontent.length; i++) tabcontent[i].style.display = "none";
            let tablinks = document.getElementsByClassName("tablinks");
            for (let i = 0; i < tablinks.length; i++) tablinks[i].className = tablinks[i].className.replace(" active", "");

            if(evt) evt.currentTarget.className += " active";
        }

        // --- BƯỚC 1 chuyển BƯỚC 2 ---
        function goToStep2() {
            inputData = {
                Fr1: parseFloat(document.getElementById('Fr1').value) || 0,
                Fr2: parseFloat(document.getElementById('Fr2').value) || 0,
                Fa: parseFloat(document.getElementById('Fa').value) || 0,
                n: parseFloat(document.getElementById('n').value) || 0,
                Lh: parseFloat(document.getElementById('Lh').value) || 0,
                K_HE: parseFloat(document.getElementById('K_HE').value) || 1,
                kd: parseFloat(document.getElementById('kd').value) || 1,
                X0: parseFloat(document.getElementById('X0').value) || 0,
                Y0: parseFloat(document.getElementById('Y0').value) || 0,

                Y: parseFloat(document.getElementById('Y_param').value) || 0,
                loai_o: document.getElementById('loai_o').value
            };

            // Set filter loại ổ tự động

            filterDB();

        // --- BƯỚC 2: BỘ LỌC KHO ---
        function filterDB() {
            const fLoai = document.getElementById('filterLoai').value;
            const fd = document.getElementById('filterD').value;
            const fD = document.getElementById('filterBigD').value;
            const fB = document.getElementById('filterB').value;
            const fC = document.getElementById('filterC').value;
            const tbody = document.getElementById('dbTableBody');
            tbody.innerHTML = '';
            
            dbOlan.forEach(row => {
                let match = true;
                if (fLoai !== 'all' && row.loai !== fLoai) match = false;
                if (fd && row.d != fd) match = false;
                if (fD && row.D != fD) match = false;
                if (fB && row.B != fB) match = false;
                if (fC && row.C < parseFloat(fC)) match = false;

                if (match) {
                    tbody.innerHTML += `<tr>
                        <td style="font-weight:bold; color:#1e3a8a;">${row.kyhieu}</td>
                        <td>${row.ten_loai}</td>
                        <td>${row.ten_co}</td>
                        <td><b class="highlight">${row.d}</b> x ${row.D} x ${row.B}</td>
                        <td class="success">${row.C.toFixed(2)}</td>
                        <td>${row.C0.toFixed(2)}</td>
                        <td>
                            <button class="btn-select" onclick='calculateAndVerify(${JSON.stringify(row)})'>Chọn Ổ Này</button>
                        </td>
                    </tr>`;
                }
            });
        }

        // --- BƯỚC 3: TÍNH TOÁN & KIỂM NGHIỆM ---
        function calculateAndVerify(bearing) {
            let d = inputData;
            
            let m_mu = 3; let hs_S = 0;
            if (bearing.loai === 'dua_con') { m_mu = 10.0 / 3.0; hs_S = 0.83; }
            else if (bearing.loai === 'bi_do_chan') { m_mu = 3; hs_S = 1.0; }
            
            let S1 = hs_S * d.e * d.Fr1;
            let S2 = hs_S * d.e * d.Fr2;

            let tong_S = S2 + d.Fa;
            let Fa1, Fa2;
            if (tong_S >= S1) { Fa1 = tong_S; Fa2 = S2; }
            else { Fa1 = S1; Fa2 = S1 - d.Fa; }

            let V = 1.0; let kt = 1.0;
            let ts1 = (d.Fr1 > 0) ? (Fa1 / (V * d.Fr1)) : 0;
            let ts2 = (d.Fr2 > 0) ? (Fa2 / (V * d.Fr2)) : 0;
            
            let X_lon = (bearing.loai === 'bi_do') ? 0.56 : 0.4;
            
            let X1 = (ts1 <= d.e) ? 1.0 : X_lon;
            let Y1 = (ts1 <= d.e) ? 0.0 : d.Y;
            let X2 = (ts2 <= d.e) ? 1.0 : X_lon;
            let Y2 = (ts2 <= d.e) ? 0.0 : d.Y;

            let Q1 = (X1 * V * d.Fr1 + Y1 * Fa1) * kt * d.kd;
            let Q2 = (X2 * V * d.Fr2 + Y2 * Fa2) * kt * d.kd;
            let Q_max = Math.max(Q1, Q2);

            let Qo1 = Math.max(d.Fr1, d.X0 * d.Fr1 + d.Y0 * Fa1);
            let Qo2 = Math.max(d.Fr2, d.X0 * d.Fr2 + d.Y0 * Fa2);
            let Qo_max = Math.max(Qo1, Qo2);

            let LhE = d.Lh * d.K_HE;
            let L_E = (60 * d.n * LhE) / 1000000.0;
            let C_cd = Q_max * Math.pow(L_E, 1/m_mu);

            let L_Et = Math.pow(bearing.C / Q_max, m_mu);
            let L_hEt = L_Et * 1000000 / (60 * d.n);
            let alpha1 = L_E / L_Et;

            // Render HTML Báo Cáo
            let statusTinh = (Qo_max <= bearing.C0) ? "ĐẠT" : "KHÔNG ĐẠT";
            let statusDong = (C_cd <= bearing.C) ? "ĐẠT" : "KHÔNG ĐẠT";
            let finalStatus = (Qo_max <= bearing.C0 && C_cd <= bearing.C) 
                ? `<div class="status-pass">✔️ KẾT LUẬN: Ổ mã ${bearing.kyhieu} ĐẠT YÊU CẦU.</div>` 
                : `<div class="status-fail">❌ KẾT LUẬN: KHÔNG ĐẠT YÊU CẦU! Bấm nút "Quay Lại Kho" bên dưới để chọn mã lớn hơn.</div>
                   <button class="btn-warning" onclick="document.getElementById('btnTabTraCuu').click(); document.getElementById('filterC').value='${(C_cd+0.1).toFixed(2)}'; filterDB();">Quay Lại Kho & Gợi Ý Mã Lớn Hơn (Tự động lọc C >= ${C_cd.toFixed(2)})</button>`;

            let html = `
            <div class="report-card">
